name: Release / Publish

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write

jobs:
  check-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if release is from main branch
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          BRANCH=$(jq -r .release.target_commitish "$GITHUB_EVENT_PATH")
          if [ "$BRANCH" != "main" ]; then
            echo "Releases should only be created from the main branch. This release is from $BRANCH."
            exit 1
          fi

  publish-action:
    name: Verify dist and promote floating tags
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: check-release-branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag and prerelease flag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            PRE="${{ github.event.release.prerelease }}"
          else
            TAG=$(gh release view --json tagName --jq .tagName)
            PRE=$(gh release view --json isPrerelease --jq .isPrerelease)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not resolve a release tag."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "Resolved tag=$TAG prerelease=$PRE"

      - name: Checkout released tag
        run: git checkout --detach "${{ steps.meta.outputs.tag }}"

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify dist matches source at released tag
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ at ${{ steps.meta.outputs.tag }} does not match a clean build from src/."
            git --no-pager diff --stat -- dist/
            exit 1
          fi
          echo "dist/ verified for ${{ steps.meta.outputs.tag }}."

      - name: Promote floating major/minor tags
        if: steps.meta.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          SHA=$(git rev-parse HEAD)
          VER="${TAG#v}"

          # Only stable MAJOR.MINOR.PATCH releases move the floating tags. Pre-releases
          # (e.g. v2.0.0-beta.0) keep their immutable tag but must never hijack @v2.
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Non-stable version $TAG: leaving floating tags unchanged."
            exit 0
          fi

          MAJOR="${VER%%.*}"
          REST="${VER#*.}"
          MINOR="${REST%%.*}"

          move_ref() {
            local ref="$1"
            if gh api "repos/$REPO/git/refs/tags/$ref" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/$ref" -f sha="$SHA" -F force=true >/dev/null
              echo "Moved $ref -> $SHA"
            else
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$ref" -f sha="$SHA" >/dev/null
              echo "Created $ref -> $SHA"
            fi
          }

          move_ref "v$MAJOR"
          move_ref "v$MAJOR.$MINOR"
          echo "Consumers on @v$MAJOR and @v$MAJOR.$MINOR now resolve to $TAG."

      - name: Prerelease note
        if: steps.meta.outputs.prerelease == 'true'
        run: echo "Prerelease ${{ steps.meta.outputs.tag }} published; floating tags left unchanged."

  # Reverts the GitHub release back to draft if dist verification or tag promotion
  # fails, so a broken release is never left published.
  revert-to-draft:
    if: always() && github.event_name == 'release' && needs.publish-action.result == 'failure'
    needs: [publish-action]
    name: Revert Release to Draft
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Revert release to draft
        run: |
          RELEASE_ID=$(jq -r .release.id "$GITHUB_EVENT_PATH")
          ORIGINAL_BODY=$(jq -r .release.body "$GITHUB_EVENT_PATH")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "> [!WARNING]"
            echo "> **Release Publishing Failed**"
            echo "> This release was automatically reverted to draft because dist verification or tag promotion failed."
            echo "> Review the [workflow logs](${RUN_URL}) and fix the issue before publishing again."
            echo "---"
            echo "$ORIGINAL_BODY"
          } > release_body.txt

          BODY_JSON=$(jq -Rs '.' < release_body.txt)
          response=$(curl -s -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.bot-token.outputs.token }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID \
            -d "{\"draft\": true, \"body\": ${BODY_JSON}}")
          if echo "$response" | jq -e '.id' > /dev/null; then
            echo "Release reverted to draft with original notes preserved"
          else
            echo "Warning: Failed to revert release"
            echo "$response" | jq '.'
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Delete release tag
        run: |
          TAG_NAME=$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")
          echo "Deleting git tag: $TAG_NAME"
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME deleted — version bump logic will no longer treat this version as released"
          else
            echo "Could not delete tag $TAG_NAME"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Revert version bump in development and update draft PR title
        run: |
          TAG_NAME=$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")
          FAILED_VERSION="${TAG_NAME#v}"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin development

          CURRENT_DEV_VERSION=$(git show origin/development:package.json | jq -r '.version')
          echo "Failed version: $FAILED_VERSION | Current version on development: $CURRENT_DEV_VERSION"

          if [ "$CURRENT_DEV_VERSION" != "$FAILED_VERSION" ]; then
            echo "development was bumped to v$CURRENT_DEV_VERSION after the failed release — reverting to v$FAILED_VERSION"

            git checkout -b revert-version-bump origin/development
            jq --arg v "$FAILED_VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
            git add package.json
            git commit -m "chore: revert version bump after failed publish of v$FAILED_VERSION"
            git push origin revert-version-bump --force

            EXISTING=$(gh pr list --state open --head revert-version-bump --base development --json number --jq '.[0].number')
            if [ -z "$EXISTING" ]; then
              gh pr create \
                --title "chore: revert version bump after failed publish of v$FAILED_VERSION" \
                --body "The v$FAILED_VERSION publish failed. Reverting package.json so the next release attempt re-uses v$FAILED_VERSION." \
                --base development \
                --head revert-version-bump
            fi

            REVERT_PR=$(gh pr list --state open --head revert-version-bump --base development --json number --jq '.[0].number')
            gh pr merge "$REVERT_PR" --admin --squash --delete-branch --repo ${{ github.repository }}
            echo "development reverted to v$FAILED_VERSION"
          else
            echo "development already at v$FAILED_VERSION — no version revert needed"
          fi

          # Update the draft dev→main PR title immediately (draft-main-pr.yml will also
          # update it when the revert PR merges, but this ensures it happens right away)
          EXPECTED_TITLE="Draft PR for release version v$FAILED_VERSION"
          PR_INFO=$(gh pr list --base main --head development --state open --json number,title --jq '.[0]')
          if [ -n "$PR_INFO" ] && [ "$PR_INFO" != "null" ]; then
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
            PR_TITLE=$(echo "$PR_INFO" | jq -r '.title')
            if [ "$PR_TITLE" != "$EXPECTED_TITLE" ]; then
              gh pr edit "$PR_NUMBER" --title "$EXPECTED_TITLE" --repo ${{ github.repository }}
              echo "Updated dev→main PR #$PR_NUMBER title to: $EXPECTED_TITLE"
            else
              echo "PR title already correct: $PR_TITLE"
            fi
          else
            echo "No open dev→main PR found — title update skipped"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
